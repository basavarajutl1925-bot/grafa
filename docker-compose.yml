version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0-alpine
    container_name: grafa-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: grafa
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - grafa-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Instance 1)
  api-1:
    build: ./backend
    container_name: grafa-api-1
    ports:
      - "5001:5000"
    environment:
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/grafa?authSource=admin
      JWT_SECRET: your-super-secret-key
      PORT: 5000
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grafa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API (Instance 2)
  api-2:
    build: ./backend
    container_name: grafa-api-2
    ports:
      - "5002:5000"
    environment:
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/grafa?authSource=admin
      JWT_SECRET: your-super-secret-key
      PORT: 5000
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grafa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API (Instance 3)
  api-3:
    build: ./backend
    container_name: grafa-api-3
    ports:
      - "5003:5000"
    environment:
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/grafa?authSource=admin
      JWT_SECRET: your-super-secret-key
      PORT: 5000
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - grafa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: grafa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - grafa-network
    restart: unless-stopped

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: grafa-redis
    ports:
      - "6379:6379"
    networks:
      - grafa-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  grafa-network:
    driver: bridge
